name: CI

# Actions minutes are billed on this private repo (the macOS leg at 10x), so a
# PR run is opt-in: label the PR `run-ci`. `labeled` is not a default activity
# type, and without it adding the label starts nothing. Push-to-main and manual
# dispatch stay automatic — post-merge verification is the last net.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel an in-flight run when the branch is pushed again — but never on main.
# PR runs are opt-in per label, so the push-to-main run is the only verification
# some commits ever get; back-to-back merges were cancelling it and landing
# unverified. On a topic branch superseding the run is still what you want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      # Every shell file in the repo, found by extension AND by shebang, so a
      # script added without a .sh suffix (bin/plug) still gets checked.
      # vendor/ is skipped via .editorconfig `ignore = true` (shfmt -f and -d both honour it).
      - name: Collect shell files
        id: collect
        run: |
          {
            echo 'files<<EOF'
            shfmt -f . | sort -u
            echo EOF
          } >>"$GITHUB_OUTPUT"
          shfmt -f . | sort -u

      - name: shellcheck
        run: shfmt -f . | xargs -r shellcheck

      - name: shfmt (check formatting)
        run: shfmt -d -i 2 -ci .

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here: it ships bash 3.2 and BSD sed/stat, which have
        # already caught two portability bugs this suite exists to prevent.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq

      # skill-lint.bats exercises the real shellcheck/shfmt paths (not just
      # the degrade-when-absent ones), so this job needs both tools too —
      # installing them only in the lint job above doesn't cover this runner.
      - name: Install shellcheck and shfmt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: Install shellcheck and shfmt (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Show shell versions
        run: |
          bash --version | head -1
          bats --version
          shellcheck --version
          shfmt --version
          git --version

      # The macOS leg exists to prove bash 3.2 compatibility. Assert it
      # instead of trusting the runner image: if a future image ships (or
      # brew pulls in) a newer bash first on PATH, the portability guarantee
      # would silently retire while the build stays green. Resolve bash the
      # same way the scripts under test do — `env bash` via PATH — rather
      # than checking this step's own $BASH_VERSION.
      - name: Assert bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          v="$(env bash -c 'echo "$BASH_VERSION"')"
          case "$v" in
            3.2.*) echo "PATH bash is $v — the 3.2 portability leg is intact" ;;
            *)
              echo "::error::PATH bash is ${v:-unknown}, not 3.2 — this leg no longer tests the portability floor"
              exit 1
              ;;
          esac

      - name: Run tests
        run: bats --print-output-on-failure tests/

  validate:
    name: validate JSON and skills
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4

      - name: settings files are valid JSON
        run: jq empty claude/settings.json claude/night-shift-settings.json

      # The plugin manifest is the second install path's whole contract; a
      # syntax error there fails the load with no symlink to fall back on.
      # `claude plugin validate` is the schema check, but the CLI is not in CI.
      - name: plugin manifest and hook config are valid JSON
        run: jq empty .claude-plugin/plugin.json .claude-plugin/hooks.json

      # The single source of truth for the mechanical skill rules is
      # bin/skill-lint; CI just runs it. --strict so a warning fails the build
      # on this repo's own skills. Bundled-script correctness is already
      # covered repo-wide by the lint job above, so skill-lint's shellcheck/
      # shfmt steps degrade to a note here rather than reinstalling the tools.
      - name: skills pass skill-lint
        run: ./bin/skill-lint skills/ --strict

      # Integrity, not quality: conf, lock and vendor/ agree, and each lock tree is
      # its path at the pinned upstream commit (fetches public upstreams).
      - name: vendored skills match plugins.lock and upstream
        run: ./bin/plug verify

      # The repo-local skills under .claude/ are never installed anywhere, so
      # they are invisible to the sweep above — and would drift unlinted.
      - name: repo-local skills pass skill-lint
        run: ./bin/skill-lint .claude/skills/ --strict

      - name: global memory stays agent-neutral
        run: |
          # memory/GLOBAL.md is installed to ~/.claude, ~/.codex and ~/.gemini
          # alike, so a sentence about one agent is wrong in the other two.
          # CLAUDE.md / AGENTS.md / GEMINI.md as filenames are fine — those are
          # the open conventions each agent reads.
          #
          # Assert the file exists first: grep exits 2 on a missing file, which
          # is falsy, so a rename would turn this guard green forever instead
          # of failing — the exact silent drift it exists to catch.
          test -f memory/GLOBAL.md || {
            echo "::error::memory/GLOBAL.md is missing — this guard cannot run"
            exit 1
          }
          # Bare 'Claude'/'Gemini' stay allowed: the file legitimately names
          # the per-agent instruction *files* (CLAUDE.md, GEMINI.md). Vendor
          # names, product compounds, and per-agent config paths do not.
          if grep -rniE 'Claude Code|Anthropic|OpenAI|ChatGPT|\bGPT\b|Copilot|Cursor|Codex|Gemini CLI|~/\.claude|~/\.codex|~/\.gemini' memory/GLOBAL.md; then
            echo "::error::memory/GLOBAL.md must not name a specific agent or vendor"
            exit 1
          fi

      - name: the Claude memory imports the portable half
        run: |
          # Claude Code loads exactly one global memory file. Without this line
          # the workflow memory silently vanishes while install.sh still links
          # everything correctly.
          grep -q '^@~/.claude/global-memory.md' claude/CLAUDE.md || {
            echo "::error file=claude/CLAUDE.md::missing the @~/.claude/global-memory.md import"
            exit 1
          }

      - name: templates stay tool-neutral
        run: |
          # A template that names a specific CLI re-couples the document to one
          # workflow, which is the drift this layout exists to prevent.
          #
          # Existence check first, for the same reason as the guard above: grep
          # exits 2 on a missing file, so deleting or renaming a template would
          # silently retire its neutrality check rather than fail the build.
          for f in templates/HANDOFF.md templates/PROJECT_STATUS.md \
            templates/PROJECT_ROADMAP.md templates/job-pr.md templates/job-report.md \
            templates/AGENT_JOB.md templates/SPEC.md; do
            test -f "$f" || {
              echo "::error file=$f::missing — this guard cannot run"
              exit 1
            }
          done
          # Skills emit whole directories into other repos too, so codebase/
          # falls under the same rule. Directories rather than files on
          # purpose: a family that adds a document per skill is then covered
          # without another edit here. A directory
          # rename would make a glob match nothing and pass silently, so
          # assert each is non-empty before grepping it — which also means a
          # directory only joins this list once it holds something.
          for d in templates/codebase templates/research; do
            test -n "$(find "$d" -type f 2>/dev/null | head -1)" || {
              echo "::error::$d is empty or missing — this guard cannot run"
              exit 1
            }
          done
          # Agent CLI names count: a template saying "ask claude to review"
          # is coupled to that agent.
          # 'mac' carries an explicit (os|book)? rather than a bare \bmac\b:
          # O and B are word characters, so \b never fires after "mac" in
          # "macOS" or "MacBook" — the two spellings a real violation uses.
          # Left anchored either side, so "machine" and "macro" still pass.
          if grep -rniE 'claude|codex|gemini|copilot|cursor|\bmac(os|book)?\b|\bVPS\b' \
            templates/HANDOFF.md templates/PROJECT_STATUS.md \
            templates/PROJECT_ROADMAP.md templates/job-pr.md templates/job-report.md \
            templates/AGENT_JOB.md templates/SPEC.md templates/codebase templates/research; then
            echo "::error::templates must not name a specific tool or machine"
            exit 1
          fi

      - name: no stray handoff at the repo root
        run: |
          # HANDOFF.md is start-of-task input, not deliverable. A PR merged
          # with one still on the branch carries it onto main — that has
          # happened (PRs #11, #14, and once while Actions was disabled by
          # billing). This is the backstop.
          for f in HANDOFF.md; do
            if [ -e "$f" ]; then
              echo "::error file=$f::stray $f at the repo root — task briefs must be dropped before merge"
              exit 1
            fi
          done
