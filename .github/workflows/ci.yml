name: CI

# Actions minutes are billed on this private repo (the macOS leg at 10x), so a
# PR run is opt-in: label the PR `run-ci`. `labeled` is not a default activity
# type, and without it adding the label starts nothing. Push-to-main and manual
# dispatch stay automatic — post-merge verification is the last net.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel an in-flight run when the branch is pushed again — but never on main.
# PR runs are opt-in per label, so the push-to-main run is the only verification
# some commits ever get; back-to-back merges were cancelling it and landing
# unverified. On a topic branch superseding the run is still what you want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      # Every shell file in the repo, found by extension AND by shebang, so a
      # script added without a .sh suffix (bin/vibe) still gets checked.
      - name: Collect shell files
        id: collect
        run: |
          {
            echo 'files<<EOF'
            shfmt -f . | sort -u
            echo EOF
          } >>"$GITHUB_OUTPUT"
          shfmt -f . | sort -u

      - name: shellcheck
        run: shfmt -f . | xargs -r shellcheck

      # Completions are sourced, not executed, and have no shebang, so shfmt -f
      # does not list them. They still have to be valid.
      - name: shellcheck completions
        run: shellcheck -s bash completions/vibe.bash

      - name: shfmt (check formatting)
        run: shfmt -d -i 2 -ci .

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here: it ships bash 3.2 and BSD sed/stat, which have
        # already caught two portability bugs this suite exists to prevent.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq

      # skill-lint.bats exercises the real shellcheck/shfmt paths (not just
      # the degrade-when-absent ones), so this job needs both tools too —
      # installing them only in the lint job above doesn't cover this runner.
      - name: Install shellcheck and shfmt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: Install shellcheck and shfmt (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Show shell versions
        run: |
          bash --version | head -1
          bats --version
          shellcheck --version
          shfmt --version
          git --version

      - name: Run tests
        run: bats --print-output-on-failure tests/

  validate:
    name: validate JSON and skills
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4

      - name: settings.json is valid JSON
        run: jq empty claude/settings.json

      - name: VS Code snippets parse once comments are stripped
        run: |
          for f in vscode/*.jsonc; do
            sed 's|^[[:space:]]*//.*$||' "$f" | jq empty || {
              echo "::error file=$f::not valid JSON after stripping comments"
              exit 1
            }
          done

      # The single source of truth for the mechanical skill rules is
      # bin/skill-lint; CI just runs it. --strict so a warning fails the build
      # on this repo's own skills. Bundled-script correctness is already
      # covered repo-wide by the lint job above, so skill-lint's shellcheck/
      # shfmt steps degrade to a note here rather than reinstalling the tools.
      - name: skills pass skill-lint
        run: ./bin/skill-lint skills/ --strict

      - name: global memory stays agent-neutral
        run: |
          # memory/GLOBAL.md is installed to ~/.claude, ~/.codex and ~/.gemini
          # alike, so a sentence about one agent is wrong in the other two.
          # CLAUDE.md / AGENTS.md / GEMINI.md as filenames are fine — those are
          # the open conventions each agent reads.
          #
          # Assert the file exists first: grep exits 2 on a missing file, which
          # is falsy, so a rename would turn this guard green forever instead
          # of failing — the exact silent drift it exists to catch.
          test -f memory/GLOBAL.md || {
            echo "::error::memory/GLOBAL.md is missing — this guard cannot run"
            exit 1
          }
          # Bare 'Claude'/'Gemini' stay allowed: the file legitimately names
          # the per-agent instruction *files* (CLAUDE.md, GEMINI.md). Vendor
          # names, product compounds, and per-agent config paths do not.
          if grep -rniE 'Claude Code|Anthropic|OpenAI|ChatGPT|\bGPT\b|Copilot|Cursor|Codex|Gemini CLI|~/\.claude|~/\.codex|~/\.gemini' memory/GLOBAL.md; then
            echo "::error::memory/GLOBAL.md must not name a specific agent or vendor"
            exit 1
          fi

      - name: the Claude memory imports the portable half
        run: |
          # Claude Code loads exactly one global memory file. Without this line
          # the workflow memory silently vanishes while install.sh still links
          # everything correctly.
          grep -q '^@~/.claude/global-memory.md' claude/CLAUDE.md || {
            echo "::error file=claude/CLAUDE.md::missing the @~/.claude/global-memory.md import"
            exit 1
          }

      - name: templates stay tool-neutral
        run: |
          # A template that names a specific CLI re-couples the document to one
          # workflow, which is the drift this layout exists to prevent.
          #
          # Existence check first, for the same reason as the guard above: grep
          # exits 2 on a missing file, so deleting or renaming a template would
          # silently retire its neutrality check rather than fail the build.
          for f in templates/HANDOFF.md templates/LOOP.md \
            templates/LOOP_PR.md templates/PROJECT_STATUS.md; do
            test -f "$f" || {
              echo "::error file=$f::missing — this guard cannot run"
              exit 1
            }
          done
          # 'vibe' unanchored on purpose: \bvibe\b misses $VIBE_WORKTREE_ROOT
          # (underscore is a word character, so \b never fires there). Agent
          # CLI names are part of the same rule — a template saying "ask
          # claude to review" is coupled just as surely as one naming vibe.
          if grep -rniE 'vibe|claude|codex|gemini|copilot|cursor|\bmac\b|\bVPS\b' \
            templates/HANDOFF.md templates/LOOP.md \
            templates/LOOP_PR.md templates/PROJECT_STATUS.md; then
            echo "::error::templates must not name a specific tool or machine"
            exit 1
          fi

      - name: no stray handoff or brief at the repo root
        run: |
          # HANDOFF.md and LOOP.md are start-of-task input, not deliverable.
          # `vibe done` refuses to finish while either is on the branch, but a
          # PR merged without it (or with CI down) can still carry one onto
          # main — that has happened twice (PRs #11 and #14) plus once more
          # while Actions was disabled by billing. This is the backstop.
          for f in HANDOFF.md LOOP.md; do
            if [ -e "$f" ]; then
              echo "::error file=$f::stray $f at the repo root — task briefs must be dropped before merge"
              exit 1
            fi
          done
