# tmux.conf — snippet for long-running agent sessions (server side).
#
# This is a SNIPPET, not a whole config. It is never symlinked over
# ~/.tmux.conf, because that would clobber settings this toolkit knows nothing
# about. Source it from your own config instead:
#
#   echo 'source-file ~/git/agentic-dev-toolkit/tmux/tmux.conf' >> ~/.tmux.conf
#   tmux source-file ~/.tmux.conf     # apply to a running server
#
# Everything here is chosen for one job: an agent running unattended in a
# detached session that you reattach to from a laptop or a phone.

# --- Reattaching from anywhere ---------------------------------------------

# Resize each window to the smallest client actually looking at it, rather than
# the smallest client attached. Without this, a phone attached to the session
# squeezes the same session on your laptop down to phone width.
setw -g aggressive-resize on

# Keep a deep scrollback. An agent can emit thousands of lines while you are
# disconnected; the default 2000 loses the part you came back to read.
set -g history-limit 100000

# --- Responsiveness ---------------------------------------------------------

# tmux waits this long after ESC to see if an escape sequence follows. The
# default 500ms makes agent TUIs feel broken. 0 is safe on a local socket.
set -sg escape-time 0

# Report focus events to programs inside — TUIs use them to redraw on reattach.
set -g focus-events on

# --- Not losing track of which task you are in -----------------------------

# vibe names each session vibe-<repo>-<branch>, so the session name IS the task.
# Programs inside must not be allowed to overwrite it.
set -g allow-rename off
setw -g automatic-rename off

# Windows renumber after one closes, so the indices stay contiguous.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Session name left, host right — on reattach you can tell at a glance which
# task and which machine you are looking at.
set -g status-left-length 40
set -g status-left '#[bold] #S #[default]'
set -g status-right '#[dim]#{?client_prefix,PREFIX ,}#h %H:%M#[default]'
set -g status-interval 5

# Messages that vanish in 750ms are unreadable over a laggy SSH link.
set -g display-time 2000

# --- Copying output off the session ----------------------------------------

# Mouse on: scroll the agent's output and select text with a trackpad.
set -g mouse on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Convenience ------------------------------------------------------------

# Reload this config without restarting the server.
bind R source-file ~/.tmux.conf \; display 'tmux.conf reloaded'

# Open new windows and splits in the current pane's directory — inside a vibe
# session that is the worktree, which is nearly always what you want.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
