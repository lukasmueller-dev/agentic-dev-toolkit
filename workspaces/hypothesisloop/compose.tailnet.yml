# Added to the checkout's localdev/controlplane/docker-compose.yml, in place of every interface:
# the stores with default or no credentials (postgres, greptimedb, memgraph) on loopback only; the API, the metrics
# service and the object store also on the tailnet address (HLOOP_BIND). Loopback stays for the
# tool's own host commands. `!override` needs docker compose 2.24.4 or later.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"
  greptimedb:
    ports: !override
      - "127.0.0.1:4010:4000"
      - "127.0.0.1:4001:4001"
  memgraph:
    ports: !override
      - "127.0.0.1:7687:7687"
  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "${HLOOP_BIND:?start sets it}:9000:9000"
  control-service:
    ports: !override
      - "127.0.0.1:${HL_API_PORT}:${HL_API_PORT}"
      - "${HLOOP_BIND:?start sets it}:${HL_API_PORT}:${HL_API_PORT}"
  metrics-service:
    ports: !override
      - "127.0.0.1:${HL_METRICS_PORT}:${HL_METRICS_PORT}"
      - "${HLOOP_BIND:?start sets it}:${HL_METRICS_PORT}:${HL_METRICS_PORT}"
