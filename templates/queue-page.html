<style>
/* Fonts: copied to web/fonts/ by vibe queue page; the CSP blocks Google Fonts. Sizes: 12, 13, 14, 16, 24 px only. */
@font-face { font-family: "Geist"; src: url("/queue/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/queue/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
/* B3 tokens (robots_web_commander style.css). Brand red only on the glider cell, the active nav item and the selected row. */
:root { color-scheme: light; --red: #e12d1a; --red-soft: #fbe9e7; --bg: #eef1f3; --surface: #ffffff; --surface-2: #f2f5f7; --fg: #11171c; --fg-2: #36434d; --muted: #53616c; --line: #d2dae0; --line-strong: #aab6bf; --accent: #3547b8; --ok: #0a7145; --warn: #8a5600; --bad: #b3261e; --bad-line: #e6aaa4; --lamp-bad: #d92d2d; --lamp-ring: #7f8c96; --lamp-off: #d2dae0; --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --red-soft: #3a1618; --bg: #0e1317; --surface: #151c22; --surface-2: #1f2930; --fg: #e8edf0; --fg-2: #b9c4cc; --muted: #9aa8b2; --line: #27323a; --line-strong: #33414b; --accent: #a9bbff; --ok: #5fd6a3; --warn: #f2b45b; --bad: #ff8a80; --bad-line: #6a2428; --lamp-bad: #ff5a52; --lamp-ring: #3a4852; --lamp-off: #222c33; }
}
* { box-sizing: border-box; }
body { display: flex; min-height: 100vh; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); text-underline-offset: 2px; }
code, .n, .repo, .el, .chip { font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* Rail: glider and vibe, Queue with the Needs-you count, Workspaces and a link per service, Config. */
.rail { position: sticky; top: 0; flex: 0 0 216px; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 20px 12px; background: var(--surface); border-right: 1px solid var(--line); }
.rail a { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; color: var(--fg-2); text-decoration: none; }
.rail .brand { justify-content: flex-start; gap: 8px; padding: 4px 10px 16px; color: var(--fg); font-size: 16px; font-weight: 600; }
.rail .c, .rail .w { margin-top: 12px; }
.rail .w { padding: 4px 10px; color: var(--muted); font-size: 12px; }
.rail .wsl { display: flex; flex-direction: column; gap: 2px; }
.rail .wsl a { justify-content: flex-start; gap: 8px; color: var(--fg); }
.rail .wsl .lamp { width: 8px; height: 8px; }
.rail .n { color: var(--bad); font-size: 12px; }
body:not(:has(#config:target, #workspaces:target, #workspaces :target)) .rail .q, body:has(#config:target) .rail .c, body:has(#workspaces:target, #workspaces :target) .rail .w { background: var(--red-soft); color: var(--fg); font-weight: 500; box-shadow: inset 2px 0 var(--red); }
.rail svg { flex: none; width: 22px; height: 22px; }
.rail svg .i, .rail svg .run rect { fill: var(--fg); }
/* While a job runs, the mark becomes a live glider: generations 0-3, CSS only. */
.rail svg .run { display: none; }
body:has(.s-running, .s-gpu) .rail svg .mark { display: none; }
body:has(.s-running, .s-gpu) .rail svg .run { display: inline; }
.rail svg .f { opacity: 0; animation: gen 1.6s steps(1, end) infinite; }
.rail svg .f1 { animation-delay: .4s; }
.rail svg .f2 { animation-delay: .8s; }
.rail svg .f3 { animation-delay: 1.2s; }
.rail svg .run .r { fill: var(--red); }
@keyframes gen { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { body:has(.s-running, .s-gpu) .rail svg .mark { display: inline; } body:has(.s-running, .s-gpu) .rail svg .run { display: none; } }
main { flex: 1 1 auto; min-width: 0; max-width: 1016px; padding: 24px 28px 48px; }
/* Header: lamp, slots, limit, GPU holder, updated; Pause or Resume, Clear limit. */
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 0 0 20px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.head h1 span:not(.hq), body:has(#config:target, #workspaces:target, #workspaces :target) .hq { display: none; }
body:has(#config:target) .hc, body:has(#workspaces:target, #workspaces :target) .hw { display: inline; }
.stat { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 13px; }
.updated.stale { color: var(--bad); }
.updated.stale::after { content: " · stale"; }
/* Pages: #queue, else #config or #workspaces when the URL hash names it or a node in it. */
.page { display: none; }
#queue, .page:target, .page:has(:target) { display: block; }
body:has(#config:target, #workspaces:target, #workspaces :target) #queue { display: none; }
/* Sections: Needs you and Running open, the rest folded to one line. */
.sec { margin: 0 0 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sec > h2, .sec > summary { margin: 0; padding: 12px 16px 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
details.sec > summary { padding: 12px 16px; cursor: pointer; }
.sec > h2 .n, .sec > summary .n { font-weight: 500; }
.sec[data-k="you"] > h2 .n { color: var(--bad); }
.none { margin: 0; padding: 10px 16px 14px; color: var(--muted); font-size: 13px; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
/* A row: lamp, title and reason (a link to its block, over the whole row), phase bar, chip, repo, time, one primary button. */
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
.row .t { color: inherit; text-decoration: none; }
.row .t::after { content: ""; position: absolute; inset: 0; }
.row .jacts, .row .btn { position: relative; }
@media (hover: hover) { .row:hover { background: var(--surface-2); } }
.row.sel, .wrow:target { background: var(--red-soft); box-shadow: inset 2px 0 var(--red); }
.lamp { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--lamp-off); }
.stat .lamp { width: 8px; height: 8px; }
.l-ok { background: var(--ok); }
.l-bad { background: var(--lamp-bad); }
.l-you { background: var(--accent); }
.l-warn { background: var(--warn); }
.l-held { background: none; box-shadow: inset 0 0 0 1.5px var(--lamp-ring); }
.l-done { background: var(--line-strong); }
.t { flex: 1; min-width: 0; }
.t b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.t b .n { color: var(--muted); font-size: 12px; font-weight: 400; }
.why { display: block; color: var(--fg-2); font-size: 13px; overflow-wrap: anywhere; }
.l-bad + .t .why { color: var(--bad); }
.pbar { display: flex; flex: none; align-items: center; gap: 3px; }
.pbar i { width: 22px; height: 4px; border-radius: 2px; background: var(--lamp-off); }
.pbar .ok { background: var(--ok); }
.pbar .run { background: var(--accent); }
.pbar .bad { background: var(--lamp-bad); }
.pbar span { margin-left: 6px; color: var(--fg-2); font-size: 13px; white-space: nowrap; }
.chip { padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.repo, .el { color: var(--muted); font-size: 12px; white-space: nowrap; }
.el { width: 48px; text-align: right; }
/* A block: lamp, state, title, meta line, then the card, its title already in the block's head. */
.bh { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); }
.bh .lamp { display: inline-block; }
.bh .st { margin-left: 8px; color: var(--fg-2); font-size: 13px; font-weight: 500; }
.bh .l-bad + .st { color: var(--bad); }
.bh h2 { margin: 8px 0 4px; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.bh h2 .n, .bh .meta { color: var(--muted); font: 12px var(--mono); }
.blk > .job { padding: 4px 24px 16px; }
.blk > .job > .top { display: none; }
.blk > .jacts { padding: 0 24px 16px; }
.job .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 0 0; }
.job .top b { font-weight: 500; }
.pill { color: var(--muted); font-size: 13px; }
.job p { margin: 4px 0 0; color: var(--fg-2); font-size: 13px; overflow-wrap: anywhere; }
.job p:empty { display: none; }
.job p.stats { color: var(--muted); }
.job p.lbl { margin-top: 12px; color: var(--muted); font-weight: 600; }
.tlog { margin: 6px 0 0; padding: 12px 14px; background: #11171c; border: 1px solid var(--line); border-radius: 8px; color: #e8edf0; font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.job p a { margin-left: 6px; }
.job details { margin: 6px 0 0; color: var(--fg-2); font-size: 13px; }
.job summary { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; cursor: pointer; }
.job .phases { color: var(--muted); font-size: 13px; }
/* Research card: a row per worker; a builds= row is indented by --d. */
.wks { margin: 12px 0 0; border-top: 1px solid var(--line); }
.wk { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; margin-left: calc(var(--d, 0) * 16px); padding: 8px 0; border-bottom: 1px solid var(--line); }
.wk .wh { overflow-wrap: anywhere; }
.wk .wm { font: 13px var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.wk p, .paste, .wk > .jacts { grid-column: 2 / -1; margin: 0; }
.paste ol { margin: 4px 0; padding: 0; list-style: none; }
.paste li { display: flex; align-items: center; gap: 8px; }
.paste code { flex: 1; min-width: 0; padding: 4px 8px; background: var(--surface-2); border-radius: 4px; font-size: 12px; overflow-wrap: anywhere; }
.paste li button { min-width: 0; }
.phases .r { color: var(--fg); }
.phases .x { color: var(--bad); }
.job ol { margin: 6px 0 0; padding-left: 22px; }
.job li { margin: 2px 0; overflow-wrap: anywhere; }
/* Write buttons: shown only after GET whoami returns your login (body.can). */
.jacts { display: none; }
body.can .jacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
body.can .p { margin: 0; }
body.can .head .jacts { margin: 0 0 0 auto; }
body.can .jacts .jacts { display: contents; }
button, .btn { display: inline-flex; flex: none; align-items: center; justify-content: center; height: 32px; min-width: 84px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--fg); font: 14px var(--sans); text-decoration: none; cursor: pointer; }
@media (hover: hover) { button:hover:not(:disabled), .btn:hover { background: var(--surface-2); } }
.btn.ui { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
button[data-confirm] { border-color: var(--bad-line); color: var(--bad); }
button.armed, button.armed:hover { background: var(--lamp-bad); border-color: var(--lamp-bad); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
:is(button, .btn, summary, .rail a, .row .t, input, textarea, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.jacts hr { flex-basis: 100%; height: 0; margin: 0; border: 0; }
.jacts .lbl { flex-basis: 100%; margin: 4px 0 -2px; color: var(--muted); font-size: 12px; font-weight: 600; }
.jacts .files { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
/* A field and its send button: ⌘↵ sends, Esc clears. */
.ask { display: flex; flex-basis: 100%; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.ask label { display: flex; flex: 1 1 160px; flex-direction: column; gap: 4px; color: var(--fg-2); font-size: 13px; }
.ask label:has(textarea) { flex-basis: 100%; }
input, textarea, select { width: 100%; min-height: 32px; padding: 5px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--fg); font: 14px var(--sans); }
textarea { resize: vertical; }
/* Markdown: Triage, Tools, Config, a panel file. */
.md { padding: 4px 16px 12px; overflow-wrap: anywhere; }
.md h1 { margin: 16px 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.md h2 { margin: 24px 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.md h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 600; }
.md p, .md li { color: var(--fg-2); }
.md code { padding: 1px 4px; background: var(--surface-2); border-radius: 4px; font-size: 12px; }
.md pre { padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.55 var(--mono); white-space: pre-wrap; }
.md pre code { padding: 0; background: none; }
.md table, .sec table { width: 100%; border-collapse: collapse; }
.md th, .sec th { color: var(--muted); font-size: 13px; font-weight: 600; }
.md th, .md td, .sec th, .sec td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
#queue > .md { margin: 0 0 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
/* Config: Settings, Actions, Recurring jobs; each a section. */
.sec > .jacts { padding: 0 16px 14px; }
/* Workspaces: a row per service, lamp, label and role, state line, Open UI and Stop, or Start; a place and hours form below. */
.wrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 16px; }
.wrow + .wrow { border-top: 1px solid var(--line); }
.wrow > .t { flex: 1 1 240px; }
.wrow .ask label:has([name="hours"]) { flex: 0 0 96px; }
.wrow .role { color: var(--muted); font-size: 13px; font-weight: 400; }
.why .warn { color: var(--warn); }
.why .bad { color: var(--bad); }
body.can .wrow > div.jacts { flex-basis: 100%; margin: 0 0 0 26px; padding: 14px 16px; background: var(--surface-2); border-radius: 8px; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
/* Panel: the block the URL hash names (#job-<key>), then a button's output or a file. A right column from 1200 px;
   under it a modal over the list, on a phone a bottom sheet. */
#panel { position: fixed; inset: 0 0 0 auto; width: min(480px, 100%); height: 100%; max-width: none; max-height: none; margin: 0; padding: 0 0 env(safe-area-inset-bottom); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 0; border-left: 1px solid var(--line); color: var(--fg); }
#panel::backdrop { background: rgba(0,0,0,.3); }
#panel > .close { position: sticky; top: 0; z-index: 1; float: right; min-width: 0; height: auto; padding: 16px 24px 8px; background: none; border: 0; color: var(--muted); font-size: 13px; }
.pnone { margin: 0; padding: 24px; color: var(--muted); font-size: 13px; }
.pout { border-top: 1px solid var(--line); }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; padding: 16px 24px 8px; }
.ph strong { font-size: 16px; font-weight: 600; }
.ph span { flex: 1; min-width: 0; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
.pmsg { max-height: 8em; margin: 0; padding: 0 24px; overflow-y: auto; color: var(--fg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.pmsg:empty { display: none; }
.pmsg.bad { color: var(--bad); }
.pbody > pre { margin: 0; padding: 14px 24px; color: var(--fg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
#panel .md { padding: 0 24px 20px; }
@media (min-width: 1200px) {
  #panel { position: sticky; inset: 0 auto auto; display: block; flex: 0 0 clamp(400px, 32vw, 560px); width: auto; height: 100vh; margin-left: auto; }
  #panel:has(> .pout[hidden]) > .close { display: none; } /* Close only while a button's output shows */
  body:has(#workspaces:target, #workspaces :target) #panel:has(> .pout[hidden]) { display: none; }
}
/* Phone: the same page in one column; the rail is a top bar. */
@media (max-width: 760px) {
  body { flex-direction: column; }
  .rail { z-index: 2; flex: none; height: auto; flex-flow: row wrap; gap: 0 20px; padding: calc(12px + env(safe-area-inset-top)) 16px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail .brand { flex-basis: 100%; padding: 0 0 4px; }
  .rail a:not(.brand) { gap: 6px; margin: 0; padding: 8px 0 10px; border-radius: 0; font-size: 14px; }
  .rail .wsl { display: none; }
  #panel { inset: auto 0 0; width: 100%; height: 76dvh; border-top: 1px solid var(--line); border-left: 0; border-radius: 10px 10px 0 0; }
  body:not(:has(#config:target, #workspaces:target, #workspaces :target)) .rail .q, body:has(#config:target) .rail .c, body:has(#workspaces:target, #workspaces :target) .rail .w { background: none; box-shadow: inset 0 -2px var(--red); }
  main { padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  .row { flex-wrap: wrap; align-items: flex-start; }
  .row > .lamp { margin-top: 5px; }
  .pbar i, .repo { display: none; }
  button, .btn { height: 44px; }
  input, textarea, select { font-size: 16px; }
  .md thead { display: none; }
  .md table, .md tbody, .md tr, .md td { display: block; width: auto; }
  .md tr { padding: 10px 0; border-top: 1px solid var(--line); }
  .md td { padding: 1px 0; border: 0; }
  .md td:first-child { color: var(--fg); font-weight: 600; }
  .md td:empty { display: none; }
}
</style>
</head>
