<title><tab></title>

<style>
/* Fonts: copied to web/fonts/ by vibe queue page; the CSP blocks Google Fonts. Sizes: 12, 13, 14, 16, 24 px only. */
@font-face { font-family: "Geist"; src: url("/queue/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/queue/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
/* B3 tokens (robots_web_commander style.css). One indigo accent: brand, selection, primary button. Red: failure states and the glider's cell. */
:root { color-scheme: light; --red: #e12d1a; --bg: #eef1f3; --bar: #ffffff; --surface: #ffffff; --surface-2: #f2f5f7; --fg: #11171c; --fg-2: #36434d; --muted: #53616c; --line: #d2dae0; --line-strong: #aab6bf; --accent: #3547b8; --sel: #e8ebf8; --badge: #dfe4f7; --primary: #3547b8; --on-primary: #ffffff; --ok: #0a7145; --warn: #8a5600; --bad: #b3261e; --lamp-bad: #d92d2d; --lamp-ring: #7f8c96; --lamp-off: #d2dae0; --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #0e1317; --bar: #10161b; --surface: #151c22; --surface-2: #1b242b; --fg: #e8edf0; --fg-2: #b9c4cc; --muted: #9aa8b2; --line: #27323a; --line-strong: #33414b; --accent: #a9bbff; --sel: #1d2731; --badge: #2a3566; --primary: #4257e0; --on-primary: #ffffff; --ok: #5fd6a3; --warn: #f2b45b; --bad: #ff8a80; --lamp-bad: #ff5a52; --lamp-ring: #3a4852; --lamp-off: #3a4852; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); text-underline-offset: 2px; }
code, .n, .el, .meta { font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* Top bar: glider and vibe queue, the tabs, the status, Pause. */
.top { background: var(--bar); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; max-width: 1440px; margin: 0 auto; padding: 0 32px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); font-size: 16px; font-weight: 600; letter-spacing: -.01em; text-decoration: none; }
.brand code { margin-left: 4px; color: var(--muted); font-weight: 400; }
.brand svg { flex: none; width: 22px; height: 22px; }
.brand svg .i, .brand svg .run rect { fill: var(--fg); }
/* While a job runs, the mark becomes a live glider: generations 0-3, CSS only. */
.brand svg .run { display: none; }
body:has(.s-running, .s-gpu) .brand svg .mark { display: none; }
body:has(.s-running, .s-gpu) .brand svg .run { display: inline; }
.brand svg .f { opacity: 0; animation: gen 1.6s steps(1, end) infinite; }
.brand svg .f1 { animation-delay: .4s; }
.brand svg .f2 { animation-delay: .8s; }
.brand svg .f3 { animation-delay: 1.2s; }
.brand svg .run .r { fill: var(--red); }
@keyframes gen { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { body:has(.s-running, .s-gpu) .brand svg .mark { display: inline; } body:has(.s-running, .s-gpu) .brand svg .run { display: none; } }
.tabs { display: flex; gap: 24px; }
.tabs a { display: flex; align-items: center; gap: 6px; padding: 18px 2px 16px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; text-decoration: none; white-space: nowrap; }
@media (hover: hover) { .tabs a:hover { color: var(--fg); } }
body:not(:has(#recurring:target, #workspaces:target, #workspaces :target, #settings:target)) .tabs .tj, body:has(#recurring:target) .tabs .tr, body:has(#workspaces:target, #workspaces :target) .tabs .tw, body:has(#settings:target) .tabs .ts { border-bottom-color: var(--accent); color: var(--fg); }
.tabs .n { min-width: 18px; padding: 0 5px; background: var(--badge); border-radius: 9px; color: var(--accent); font: 600 12px/18px var(--mono); text-align: center; }
.tabs .n:empty { display: none; }
.stat { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.updated { color: var(--bad); font-weight: 600; }
.updated:not(.stale) { display: none; }
/* Pages: #jobs, else the one the URL hash names, or holds a node it names. */
main { display: flex; align-items: flex-start; gap: 28px; max-width: 1440px; margin: 0 auto; padding: 28px 32px 48px; }
.page { display: none; flex: 1 1 auto; min-width: 0; }
#jobs { display: block; flex: 1 1 480px; max-width: 600px; }
.page:target, .page:has(:target) { display: block; }
body:has(#recurring:target, #workspaces:target, #workspaces :target, #settings:target) #jobs { display: none; }
#recurring, #settings { max-width: 1040px; margin: 0 auto; }
.page h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.page > .note { margin: 0 0 24px; color: var(--muted); }
/* Sections: a small head over a card; Queued, On hold, PR problems and Done fold in one card. */
.sec { margin: 0 0 24px; }
.sec > h2 { display: flex; gap: 8px; align-items: baseline; margin: 0 0 8px 4px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.sec > h2 span { font-weight: 500; letter-spacing: 0; text-transform: none; }
.sec[data-k="you"] > h2 .n { color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card > * + * { border-top: 1px solid var(--line); }
.none { margin: 0; padding: 12px 16px; color: var(--muted); font-size: 13px; }
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
.folds > summary, .folds > details > summary { display: flex; align-items: baseline; gap: 6px; padding: 12px 16px; color: var(--fg-2); font-weight: 500; }
.folds > details > summary .n { color: var(--muted); font-size: 13px; font-weight: 400; }
.folds > details > summary::after { content: "›"; margin-left: auto; color: var(--muted); }
.folds > details[open] > summary::after { transform: rotate(90deg); }
.folds > details > :not(summary) { border-top: 1px solid var(--line); }
.folds > .sec { margin: 0; }
/* A row: lamp, title and progress, the line below (a link to its block, over the whole row), run time, one primary button. */
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.row .t { flex: 1; min-width: 0; color: inherit; text-decoration: none; }
.row .t::after { content: ""; position: absolute; inset: 0; }
.row .jacts, .row .btn { position: relative; }
@media (hover: hover) { .row:hover { background: var(--surface-2); } }
.row.sel { background: var(--sel); box-shadow: inset 2px 0 var(--accent); }
.lamp { flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp-off); }
.l-ok { background: var(--ok); }
.l-bad { background: var(--lamp-bad); }
.l-you { background: var(--accent); }
.l-warn { background: var(--warn); }
.l-held { background: none; box-shadow: inset 0 0 0 1.5px var(--lamp-ring); }
.l-done { background: var(--line-strong); }
.t b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.t b .n { color: var(--muted); font-size: 12px; font-weight: 400; }
.row .why { display: block; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.row .l-bad + .t .why { color: var(--bad); }
.el { color: var(--muted); font-size: 12px; white-space: nowrap; }
/* A block: lamp and state, title, meta line, then the card, its title already in the block's head; Activity last. */
.bh { padding: 28px 32px 0; }
.bh .st { margin-left: 8px; color: var(--fg-2); font-size: 13px; font-weight: 500; }
.bh .l-ok + .st { color: var(--ok); }
.bh .l-bad + .st { color: var(--bad); }
.bh .l-you + .st { color: var(--accent); }
.bh h2 { margin: 6px 0 4px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.bh h2 .n { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }
.meta { color: var(--muted); font-size: 12px; }
.blk > .job { padding: 0 32px 4px; }
.blk > .job > .top { display: none; }
.blk > .act { padding: 0 32px 28px; }
.job .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 12px 0 0; }
.job .top b { font-weight: 500; }
.pill { color: var(--muted); font-size: 13px; }
.job p { margin: 6px 0 0; color: var(--fg-2); overflow-wrap: anywhere; }
.blk > .job > p:first-of-type { margin-top: 16px; color: var(--fg); }
.job p:empty { display: none; }
.job p.stats { color: var(--muted); font-size: 13px; }
.job h3, .act h3 { margin: 24px 0 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
.steps { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 20px 0 0; color: var(--muted); font-size: 13px; }
.steps span { border-bottom: 1px dotted var(--line-strong); cursor: help; }
/* The tip under the steps line, full width at most: no clip at the panel edge; focus shows it on a tap. */
.steps span:is(:hover, :focus)::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 0; z-index: 2; width: max-content; max-width: 100%; padding: 6px 10px; background: var(--fg); border-radius: 6px; color: var(--surface); font-size: 12px; font-weight: 400; line-height: 1.4; pointer-events: none; }
.steps i { color: var(--line-strong); font-style: normal; }
.steps .ok { color: var(--ok); }
.steps .run { color: var(--fg); font-weight: 500; }
.steps .bad { color: var(--bad); }
.task p { max-width: 68ch; margin: 0; color: var(--fg); white-space: pre-line; }
.task:has(> details:not([open])) > p { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.task details { margin: 4px 0 0; }
.task summary { color: var(--accent); font-size: 13px; }
.files p { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; font-size: 13px; }
.act ol { margin: 0; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; list-style: none; }
.act li { display: grid; grid-template-columns: 44px 64px minmax(0, 1fr); gap: 12px; padding: 10px 14px; font-size: 13px; }
.act li + li { border-top: 1px solid var(--line); }
.act li > span:first-child { color: var(--muted); font-family: var(--mono); }
.act li > span:nth-child(2) { color: var(--muted); overflow-wrap: anywhere; }
.act li.ag > span:nth-child(2) { color: var(--accent); }
.act li > span:last-child { overflow-wrap: anywhere; }
.act li:not(.ag) > span:last-child { font-family: var(--mono); font-size: 12px; }
.act p { margin: 0; color: var(--muted); font-size: 13px; }
body:not(.can) :is(.files, .act) { display: none; }
.job details.stack { margin: 16px 0 0; }
.job details.stack > summary { color: var(--muted); font-size: 13px; }
.stack > .job { padding: 0 0 12px 12px; border-left: 2px solid var(--line); }
/* Research card: a row per worker; a builds= row is indented by --d. */
.wks { margin: 12px 0 0; border-top: 1px solid var(--line); }
.wk { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; margin-left: calc(var(--d, 0) * 16px); padding: 8px 0; border-bottom: 1px solid var(--line); }
.wk .wh { overflow-wrap: anywhere; }
.wk .wh .n { color: var(--muted); font-size: 12px; }
.wk .wm { font: 13px var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.wk p, .paste, .wk > .jacts { grid-column: 2 / -1; margin: 0; }
.paste ol { margin: 4px 0; padding: 0; list-style: none; }
.paste li { display: flex; align-items: center; gap: 8px; }
.paste code { flex: 1; min-width: 0; padding: 4px 8px; background: var(--surface-2); border-radius: 4px; font-size: 12px; overflow-wrap: anywhere; }
.paste li button { min-width: 0; }
/* Write buttons: shown only after GET whoami returns your login (body.can). */
.jacts { display: none; }
body.can .jacts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 20px 0 0; }
body.can .p, body.can .line .jacts, body.can td .jacts { margin: 0; }
body.can .bar > .jacts { margin: 0 0 0 4px; }
body.can .jacts .jacts { display: contents; }
.jacts > button[data-act="archive"] { margin-left: auto; }
button, .btn { display: inline-flex; flex: none; align-items: center; justify-content: center; height: 36px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; color: var(--fg); font: 500 13px var(--sans); text-decoration: none; cursor: pointer; }
@media (hover: hover) { button:hover:not(:disabled), .btn:hover { background: var(--surface-2); } }
.ask.note button[data-act="retry"], .btn.ui { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
button.armed, button.armed:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
button:disabled { opacity: .5; cursor: default; }
:is(button, .btn, summary, .tabs a, .row .t, input, textarea, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.jacts hr { flex-basis: 100%; height: 0; margin: 0; border: 0; }
/* A field and its send button: ⌘↵ sends, Esc clears. The note of a failed job: its buttons on one line under it. */
.ask { display: flex; flex-basis: 100%; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.ask.note { display: contents; }
.ask label { display: flex; flex: 1 1 160px; flex-direction: column; gap: 4px; color: var(--fg-2); font-size: 13px; }
.ask label:has(textarea) { flex-basis: 100%; }
input, textarea, select { width: 100%; min-height: 36px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px; color: var(--fg); font: 14px var(--sans); }
textarea { resize: vertical; }
/* Markdown: PR problems, a panel file. */
.md { padding: 4px 16px 12px; overflow-wrap: anywhere; }
.md h1 { margin: 16px 0 8px; font-size: 16px; font-weight: 600; }
.md h2 { margin: 24px 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.md h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 600; }
.md p, .md li { color: var(--fg-2); }
.md code { padding: 1px 4px; background: var(--surface-2); border-radius: 4px; font-size: 12px; }
.md pre { padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.55 var(--mono); white-space: pre-wrap; }
.md pre code { padding: 0; background: none; }
.md table, .page table { width: 100%; border-collapse: collapse; }
.md th, .page th { color: var(--muted); font-size: 13px; font-weight: 500; }
.md th, .md td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
/* Recurring: a table per repo. Settings: a line per setting. */
#recurring .sec > h2 { font-family: var(--mono); font-size: 13px; letter-spacing: 0; text-transform: none; }
.page > h1 + .sec { margin-top: 20px; }
.page th, .page td { padding: 10px 16px; text-align: left; vertical-align: middle; }
.page tr + tr td { border-top: 1px solid var(--line); }
.page th { border-bottom: 1px solid var(--line); }
.page td:nth-child(2), .page td:nth-child(3), .page td:nth-child(4) { color: var(--fg-2); font: 13px var(--mono); }
.page td:last-child { width: 1%; white-space: nowrap; }
.line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 20px; }
.line b { font-weight: 500; }
.line p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.line p:empty { display: none; }
.line .ask { flex: none; flex-wrap: nowrap; }
.line input { width: 200px; }
.line input[type="number"] { width: 80px; }
/* Workspaces: a card per tool; its state on top, its buttons or form below. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 16px; }
.wrow { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.wrow:target { box-shadow: 0 0 0 2px var(--accent); }
.wrow .t { display: flex; flex-direction: column; gap: 4px; }
.wrow .t b { font-size: 16px; font-weight: 600; }
.wrow .why { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
.wrow .why:has(.l-ok) { color: var(--ok); }
.wrow .why:has(.l-bad) { color: var(--bad); }
.wrow .role { color: var(--fg-2); font-size: 13px; }
.why .warn { color: var(--warn); }
.why .bad { color: var(--bad); }
body.can .wrow > .jacts { margin: 0; }
.wrow .ask label:has([name="hours"]) { flex: 0 0 96px; }
.rcp { align-self: flex-start; font-size: 13px; }
/* Panel: the block the URL hash names (#job-<key>), then a button's output or a file. A column right of the list
   from 1200 px; under it a modal over the list, on a phone a bottom sheet. */
#panel { position: fixed; inset: 0 0 0 auto; width: min(480px, 100%); height: 100%; max-width: none; max-height: none; margin: 0; padding: 0 0 env(safe-area-inset-bottom); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 0; border-left: 1px solid var(--line); color: var(--fg); }
#panel::backdrop { background: rgba(0,0,0,.3); }
#panel > .close { position: sticky; top: 0; z-index: 1; float: right; height: auto; padding: 16px 24px 8px; background: none; border: 0; color: var(--muted); font-weight: 400; }
#panel > .close:focus-visible { outline-offset: -6px; }
.pnone { margin: 0; padding: 28px 32px; color: var(--muted); font-size: 13px; }
.pout { border-top: 1px solid var(--line); }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; padding: 16px 32px 8px; }
.ph strong { font-size: 16px; font-weight: 600; }
.ph span { flex: 1; min-width: 0; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
.pmsg { max-height: 8em; margin: 0; padding: 0 32px; overflow-y: auto; color: var(--fg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.pmsg:empty { display: none; }
.pmsg.bad { color: var(--bad); }
.pbody > pre { margin: 0; padding: 14px 32px; color: var(--fg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
#panel .md { padding: 0 32px 20px; }
@media (min-width: 1200px) {
  #panel { position: sticky; inset: 16px auto auto; display: block; flex: 999 1 560px; width: auto; height: auto; max-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: 10px; }
  #panel:has(> .pout[hidden]) > .close { display: none; } /* Close only while a button's output shows */
  body:has(#recurring:target, #workspaces:target, #workspaces :target, #settings:target) #panel { display: none; }
}
@media (max-width: 1199px) { #jobs { max-width: none; } }
/* Phone: the tabs on a line of their own; the status keeps its count and Runner stopped. */
@media (max-width: 760px) {
  .bar { gap: 0 12px; padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
  .tabs { order: 3; flex-basis: 100%; gap: 20px; margin-top: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 10px 2px 12px; }
  .stat .more { display: none; }
  main { padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  #panel { inset: auto 0 0; width: 100%; height: 76dvh; border-top: 1px solid var(--line); border-left: 0; border-radius: 10px 10px 0 0; }
  .bh, .blk > .job, .blk > .act, .ph, .pmsg, .pbody > pre, #panel .md { padding-left: 20px; padding-right: 20px; }
  .bh { padding-top: 20px; }
  button, .btn { height: 44px; }
  input, textarea, select { font-size: 16px; }
  .line input { width: 140px; }
  .page th:nth-child(2), .page td:nth-child(2) { display: none; }
  .page th, .page td { padding: 10px 12px; }
