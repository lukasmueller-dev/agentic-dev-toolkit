<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Queue</title>
<style>
:root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5f6b7a; --line: #dfe3e8; --blue: #0969da; --green: #1a7f37; --red: #cf222e; --grey: #6e7781; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --line: #30363d; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --grey: #8b949e; }
}
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 760px; padding: 0 16px 32px; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
a { color: var(--blue); }
nav { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
nav a { flex: 1; padding: 8px; border-radius: 8px; color: var(--muted); font-weight: 600; text-align: center; text-decoration: none; }
nav .q, body:has(#briefing:target) nav .b, body:has(#config:target) nav .c { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
body:has(#briefing:target, #config:target) nav .q { background: none; color: var(--muted); box-shadow: none; }
.updated { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
section { display: none; scroll-margin-top: 72px; }
#queue, .md:target { display: block; }
body:has(.md:target) #queue { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.chip { padding: 4px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
.flags { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; }
.filter input { position: absolute; opacity: 0; }
.filter label { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 600; }
.filter input:checked + label { background: var(--text); border-color: var(--text); color: var(--bg); }
body:has(#f-active:checked) .job:not(.s-running, .s-gpu),
body:has(#f-active:checked) .repo:not(:has(.s-running, .s-gpu)),
body:has(#f-wait:checked) .job:not(.s-queued, .s-held),
body:has(#f-wait:checked) .repo:not(:has(.s-queued, .s-held)),
body:has(#f-you:checked) .job:not(.s-blocked, .s-failed, .s-timeout, .s-skipped),
body:has(#f-you:checked) .repo:not(:has(.s-blocked, .s-failed, .s-timeout, .s-skipped)),
body:has(#f-done:checked) .job:not(.s-done),
body:has(#f-done:checked) .repo:not(:has(.s-done)) { display: none; }
h2 { margin: 24px 0 8px; color: var(--muted); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.job { margin: 8px 0; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--grey); border-radius: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.top b { flex: 1; overflow-wrap: anywhere; }
.pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill { background: var(--grey); color: var(--card); }
.job p { margin: 6px 0 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.job p:empty { display: none; }
.job p.stats { font-size: 13px; }
.job details { margin: 8px 0 0; font-size: 14px; }
.job summary { overflow-wrap: anywhere; cursor: pointer; }
.job ol { margin: 6px 0 0; padding-left: 22px; color: var(--muted); }
.job li { margin: 2px 0; overflow-wrap: anywhere; }
.s-running, .s-gpu { border-left-color: var(--blue); }
.s-running .pill, .s-gpu .pill { background: var(--blue); }
.s-done { border-left-color: var(--green); }
.s-done .pill { background: var(--green); }
.s-failed, .s-blocked, .s-timeout, .s-skipped { border-left-color: var(--red); }
.s-failed .pill, .s-blocked .pill, .s-timeout .pill, .s-skipped .pill { background: var(--red); }
.md h1 { font-size: 20px; }
.md h3 { font-size: 16px; }
.md table { width: 100%; border-collapse: collapse; font-size: 14px; }
.md th, .md td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md pre { white-space: pre-wrap; font-size: 13px; }
.md pre, .md code, .md td { overflow-wrap: anywhere; }
@media (max-width: 700px) {
  .md thead { display: none; }
  .md table, .md tbody, .md tr, .md td { display: block; width: auto; }
  .md tr { margin: 8px 0; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .md td { padding: 2px 0; border: 0; }
  .md td:first-child { font-weight: 600; }
  #config td:not(:first-child) { display: inline; }
  #config td:not(:first-child):not(:last-child)::after { content: " · "; }
}
</style>
</head>
<body>
<nav><a class="q" href="#queue">Queue</a><a class="b" href="#briefing">Briefing</a><a class="c" href="#config">Config</a></nav>
<p class="updated">updated <updated></p>
<section id="queue">
<div class="chips"><counts></div>
<p class="flags"><flags></p>
<div class="filter">
<input type="radio" name="f" id="f-all" checked><label for="f-all">All</label>
<input type="radio" name="f" id="f-active"><label for="f-active">Active</label>
<input type="radio" name="f" id="f-wait"><label for="f-wait">Waiting</label>
<input type="radio" name="f" id="f-you"><label for="f-you">Needs you</label>
<input type="radio" name="f" id="f-done"><label for="f-done">Done</label>
</div>
<jobs>
</section>
<section id="briefing" class="md">
<briefing>
</section>
<section id="config" class="md">
<config>
</section>
</body>
</html>
