name: CI

# On a private repo, PR runs are opt-in: add the `run-ci` label to the PR to
# start one. Push to the default branch always runs, so a merge is always
# verified. On a public repo, delete the `if:` line on each job and the
# `labeled` activity type below — public repos get free Actions minutes and
# don't need the gate.
#
# Assumes the default branch is `main`. If the repo's default is something else
# (master, trunk, develop), replace `main` in the push trigger and the
# concurrency line below — GitHub expands no variable there, and an unreplaced
# `main` means no run ever fires on merge, contradicting the promise above.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Supersede an in-flight run when the branch is pushed again — but never on
# the default branch, whose run may be the only verification a merge gets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --if-present keeps this workflow valid before every script exists.
      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
