name: CI

# If CI minutes are billed on this repo (private repo on a free plan), PR runs
# are opt-in: add the `run-ci` label to the PR to start one. Push to the
# default branch always runs, so a merge is always verified. On a repo with
# free minutes, delete the `if:` line on each job and the `labeled` activity
# type below.
#
# Assumes the default branch is `main`. If the repo's default is something else
# (master, trunk, develop), replace `main` in the push trigger and the
# concurrency line below — GitHub expands no variable there, and an unreplaced
# `main` means no run ever fires on merge, contradicting the promise above.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Supersede an in-flight run when the branch is pushed again — but never on
# the default branch, whose run may be the only verification a merge gets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
